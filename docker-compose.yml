services:
  postgres:
    image: postgres:15
    container_name: buildvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildvision
      POSTGRES_PASSWORD: buildvision_password
      POSTGRES_DB: buildvision
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buildvision_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro

volumes:
  buildvision_postgres_data:
