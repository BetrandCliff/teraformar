name: Deploy Teraformar

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Get latest source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Next.js production application
      - name: Build application
        run: npm run build

      # 5. Verify production build
      - name: Verify build output
        run: |
          test -d .next
          test -d .next/static
          echo "Next.js build output exists."
          find .next/static -maxdepth 2 -type d | head -40

      # 6. Create deployment trigger
      - name: Create deployment trigger
        run: echo "${{ github.sha }}" > .deploy-trigger

      # 7. Create Passenger restart file
      - name: Create Passenger restart file
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      # 8. Deploy to cPanel
      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          state-name: .ftp-deploy-sync-state.json
          log-level: verbose
          timeout: 60000

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.next/cache/**
            **/.env
            **/.env.*
            **/deploy.log
            **/.deployed-commit
            **/stderr.log

      # 9. Deployment summary
      - name: Deployment complete
        run: |
          echo "Deployment upload completed."
          echo "Commit: ${{ github.sha }}"
          echo "Inspect the FTP logs above for any errors."
