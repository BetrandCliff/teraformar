```yaml
name: Deploy Teraformar

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Build Next.js application
      # --------------------------------------------------
      - name: Build application
        run: npm run build

      # --------------------------------------------------
      # 5. Package Next.js build
      # --------------------------------------------------
      - name: Package Next.js build
        run: |
          zip -r .next-deploy.zip .next -x ".next/cache/*"

      # --------------------------------------------------
      # 6. Create deployment trigger
      # --------------------------------------------------
      - name: Create deployment trigger
        run: |
          echo "${{ github.sha }}" > .deploy-trigger

      # --------------------------------------------------
      # 7. Deploy application files
      # --------------------------------------------------
      - name: Deploy application files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          timeout: 120000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/.next/**
            **/.next-deploy.zip
            **/deploy.log
            **/.deployed-commit
            **/stderr.log

      # --------------------------------------------------
      # 8. Upload packaged Next.js build
      # --------------------------------------------------
      - name: Upload Next.js build
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          timeout: 120000
          log-level: verbose
          exclude: |
            **
            !.next-deploy.zip

      # --------------------------------------------------
      # 9. Upload deployment trigger
      # --------------------------------------------------
      - name: Upload deployment trigger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          timeout: 120000
          log-level: verbose
          exclude: |
            **
            !.deploy-trigger
