name: Deploy Teraformar

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get latest source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Next.js production application
      - name: Build application
        run: npm run build

      # 5. Create deployment information
      - name: Create deployment trigger
        run: |
          echo "${{ github.sha }}" > .deploy-trigger

      # 6. Create Passenger restart file
      - name: Create Passenger restart file
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      # 7. Deploy everything to cPanel
      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          server-dir: ./
          local-dir: ./

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/.next/cache/**
            **/deploy.log
            **/.deployed-commit
            **/stderr.log

      # 8. Wait briefly for FTP upload to finish
      - name: Wait for deployment
        run: |
          echo "Files uploaded successfully."
          echo "Passenger restart file uploaded."
          sleep 5

      # 9. Deployment summary
      - name: Deployment complete
        run: |
          echo "======================================"
          echo "Teraformar deployment completed"
          echo "Commit: ${{ github.sha }}"
          echo "Next.js build: SUCCESS"
          echo "Files uploaded: SUCCESS"
          echo "Passenger restart: TRIGGERED"
          echo "======================================"
